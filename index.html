<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Relatórios — P.A 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- monday SDK: dá acesso ao contexto e à API automaticamente, sem token -->
<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.6/dist/main.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #14304A; --brand-mid: #2C5F8A; --brand-light: #EAF1F8;
    --accent: #C8963E; --accent-light: #FDF3E3;
    --success: #2D7D52; --success-bg: #E8F5EE;
    --warning: #B8650A; --warning-bg: #FEF3E2;
    --danger: #B03030; --danger-bg: #FCEAEA;
    --border: #DCE3EC; --bg: #F5F7FA; --white: #FFFFFF;
    --text: #1A2535; --text-muted: #6B7A90;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter Tight', system-ui, sans-serif;
    --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  /* TOPBAR */
  .topbar { background: var(--brand); color: white; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-logo { width: 32px; height: 32px; border-radius: 7px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; font-family: var(--font-display); }
  .topbar-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar-sub { font-size: 11px; opacity: 0.55; margin-top: 1px; }
  .topbar-actions { display: flex; gap: 6px; }
  .btn-icon { background: rgba(255,255,255,0.10); border: none; border-radius: 6px; color: white; height: 34px; padding: 0 12px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; transition: background 0.2s; font-family: var(--font-body); font-weight: 500; }
  .btn-icon:hover { background: rgba(255,255,255,0.22); }

  .container { padding: 1.25rem; max-width: 1200px; margin: 0 auto; }

  /* STATE CARDS */
  .state-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 2.5rem 2rem; text-align: center; color: var(--text-muted); max-width: 560px; margin: 2rem auto; }
  .state-card .icon { font-size: 40px; margin-bottom: 0.75rem; opacity: 0.5; }
  .state-card h3 { font-family: var(--font-display); font-size: 20px; color: var(--text); margin-bottom: 0.5rem; font-weight: 600; }
  .state-card p { font-size: 13px; line-height: 1.6; }

  .loading-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 4rem 2rem; }
  .spinner-lg { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* REPORT HEADER */
  .report-header { background: linear-gradient(135deg, var(--brand) 0%, #1f4a72 100%); border-radius: var(--radius); padding: 1.75rem 1.85rem 1.4rem; color: white; margin-bottom: 1.25rem; position: relative; overflow: hidden; }
  .report-header::before { content: ''; position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.04); }
  .report-header::after { content: ''; position: absolute; bottom: -50px; right: 60px; width: 110px; height: 110px; border-radius: 50%; background: rgba(200,150,62,0.18); }
  .report-meta { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; opacity: 0.65; margin-bottom: 0.5rem; font-weight: 500; }
  .report-title { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin-bottom: 0.7rem; line-height: 1.15; letter-spacing: -0.015em; }
  .report-desc { font-size: 13.5px; opacity: 0.82; line-height: 1.6; max-width: 620px; margin-bottom: 1rem; }
  .report-badges { display: flex; gap: 7px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
  .badge-white { background: rgba(255,255,255,0.13); color: white; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 0.85rem; margin-bottom: 1.25rem; }
  .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500; }
  .stat-value { font-size: 24px; font-weight: 600; color: var(--text); font-family: var(--font-display); letter-spacing: -0.01em; }
  .stat-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .progress-wrap { background: var(--border); border-radius: 99px; height: 5px; overflow: hidden; margin-top: 9px; }
  .progress-fill { height: 100%; border-radius: 99px; transition: width 0.8s ease; }

  /* SECTIONS */
  .section { margin-bottom: 1.25rem; }
  .section-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--brand); margin-bottom: 0.85rem; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* IMAGES */
  .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 0.85rem; }
  .image-block { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .image-block img { width: 100%; height: 180px; object-fit: cover; display: block; }
  .img-caption { padding: 0.6rem 0.85rem; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .img-remove { color: var(--danger); cursor: pointer; font-size: 11px; background: none; border: none; padding: 2px 6px; border-radius: 3px; }
  .img-remove:hover { background: var(--danger-bg); }
  .image-upload-zone { width: 100%; height: 140px; border: 2px dashed var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: var(--bg); transition: all 0.2s; gap: 6px; color: var(--text-muted); font-size: 12.5px; }
  .image-upload-zone:hover { border-color: var(--brand-mid); background: var(--brand-light); color: var(--brand); }
  .image-upload-zone input { display: none; }

  /* TABLE */
  .items-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--bg); padding: 10px 14px; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); text-align: left; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  tbody td { padding: 10px 14px; font-size: 12.5px; color: var(--text); }
  .status-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .s-done { background: var(--success-bg); color: var(--success); }
  .s-progress { background: var(--warning-bg); color: var(--warning); }
  .s-stuck { background: var(--danger-bg); color: var(--danger); }
  .s-waiting { background: var(--brand-light); color: var(--brand); }
  .s-blank { background: #eef0f3; color: #888; }

  .notes-block { background: var(--accent-light); border-left: 4px solid var(--accent); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 0.9rem 1.1rem; font-size: 13px; color: var(--text); line-height: 1.65; }

  .empty-section { background: var(--white); border: 1px dashed var(--border); border-radius: var(--radius); padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 12.5px; }

  .footer-meta { text-align: right; font-size: 10.5px; color: var(--text-muted); margin-top: 1.5rem; padding-top: 0.85rem; border-top: 1px solid var(--border); }

  /* TOAST */
  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 999; background: var(--brand); color: white; border-radius: var(--radius-sm); padding: 11px 17px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px); transition: all 0.3s; pointer-events: none; max-width: 380px; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { background: var(--danger); }

  /* MODO STANDALONE (fora do monday) */
  .standalone-banner { background: var(--accent-light); border-bottom: 1px solid var(--accent); padding: 8px 1.25rem; font-size: 12px; color: var(--warning); display: none; align-items: center; gap: 8px; }
  .standalone-banner.show { display: flex; }

  @media print {
    .topbar, .standalone-banner, .image-upload-zone, .img-remove { display: none !important; }
    .container { padding: 0; max-width: none; }
    body { background: white; }
    .report-header { background: var(--brand) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">P</div>
    <div>
      <div class="topbar-title">Gerador de Relatórios</div>
      <div class="topbar-sub" id="board-sub">A carregar contexto…</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn-icon" onclick="window.print()">🖨 Imprimir / PDF</button>
    <button class="btn-icon" onclick="reload()">↻ Recarregar</button>
  </div>
</div>

<div class="standalone-banner" id="banner">
  ⚠️ Esta app foi aberta fora do monday.com — a correr em modo demo. Para usar com dados reais, instala a app dentro de um board do P.A 2026.
</div>

<div class="container" id="root">
  <div class="loading-overlay">
    <div class="spinner-lg"></div>
    <div style="color:var(--text-muted);font-size:13px;">A inicializar e ler contexto do monday…</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  monday SDK — autenticação automática
// ═══════════════════════════════════════════════════════════════════════
const monday = window.mondaySdk ? window.mondaySdk() : null;

// Estado
let currentBoardId = null;
let currentBoardName = '';
let projectImages = []; // {name, dataUrl}

// ═══════════════════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════════════════
function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type==='err' ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3500);
}

function statusClass(s) {
  if (!s) return 's-blank';
  const sl = String(s).toLowerCase();
  if (sl.includes('conclu') || sl.includes('done') || sl.includes('feito') || sl.includes('terminado')) return 's-done';
  if (sl.includes('progress') || sl.includes('progresso') || sl.includes('andamento') || sl.includes('curso') || sl.includes('working')) return 's-progress';
  if (sl.includes('parado') || sl.includes('stuck') || sl.includes('bloqueado') || sl.includes('suspenso') || sl.includes('atrasado')) return 's-stuck';
  if (sl.includes('aguardar') || sl.includes('waiting') || sl.includes('planned') || sl.includes('por iniciar')) return 's-waiting';
  return 's-blank';
}

function progressColor(p) {
  if (p >= 80) return '#2D7D52';
  if (p >= 50) return '#2C5F8A';
  if (p >= 30) return '#C8963E';
  return '#B03030';
}

function getCol(item, ...titles) {
  for (const title of titles) {
    const found = item.column_values.find(c =>
      c.column?.title?.toLowerCase().includes(title.toLowerCase())
    );
    if (found?.text) return found.text;
  }
  return '';
}

// ═══════════════════════════════════════════════════════════════════════
//  Carregar dados de um board via SDK (sem token!)
// ═══════════════════════════════════════════════════════════════════════
async function loadBoardData(boardId) {
  const query = `query {
    boards(ids: [${boardId}]) {
      id
      name
      description
      items_page(limit: 200) {
        items {
          id
          name
          column_values {
            id
            text
            value
            column { title }
          }
        }
      }
    }
  }`;

  const response = await monday.api(query);
  const board = response.data?.boards?.[0];
  if (!board) throw new Error('Board não encontrado ou sem permissões.');
  return board;
}

// Transforma um board do monday em estrutura do relatório
function buildReportFromBoard(board) {
  const items = board.items_page?.items || [];

  // Tentar extrair um "item de resumo" (com nome "Resumo", "Sumário", etc.) ou usar o primeiro
  const summaryItem = items.find(i => /resumo|sum[áa]rio|overview|geral/i.test(i.name)) || items[0];

  let info = {
    desc: board.description || '',
    status: '—',
    progress: 0,
    responsavel: '—',
    inicio: '—',
    fim: '—',
    orcamento: '—',
    gasto: '—',
    notas: '',
    items: []
  };

  if (summaryItem) {
    info.status = getCol(summaryItem, 'status', 'estado') || info.status;
    const rawProg = getCol(summaryItem, 'progress', 'progresso', 'percentagem', 'percent', '%');
    info.progress = parseInt(rawProg) || 0;
    info.responsavel = getCol(summaryItem, 'responsável', 'responsavel', 'pessoa', 'owner', 'assignee', 'atribuído', 'pm') || info.responsavel;
    info.inicio = getCol(summaryItem, 'início', 'inicio', 'start', 'data início') || info.inicio;
    info.fim = getCol(summaryItem, 'fim', 'end', 'prazo', 'deadline', 'data fim', 'término', 'termino') || info.fim;
    info.orcamento = getCol(summaryItem, 'orçamento', 'orcamento', 'budget', 'custo') || info.orcamento;
    info.gasto = getCol(summaryItem, 'gasto', 'spent', 'executado', 'realizado') || info.gasto;
    info.notas = getCol(summaryItem, 'notas', 'notes', 'observações', 'observacoes', 'comentários') || '';
  }

  info.items = items.map(it => ({
    nome: it.name,
    resp: getCol(it, 'responsável', 'responsavel', 'pessoa', 'owner', 'assignee', 'atribuído') || '—',
    status: getCol(it, 'status', 'estado') || '—',
    prazo: getCol(it, 'prazo', 'deadline', 'data', 'date', 'término', 'termino', 'fim', 'end') || '—',
    kpi: getCol(it, 'kpi') || ''
  }));

  // Auto-calcular progresso se não veio do board
  if (info.progress === 0 && info.items.length) {
    const done = info.items.filter(i => statusClass(i.status) === 's-done').length;
    info.progress = Math.round((done / info.items.length) * 100);
  }
  // Auto-status
  if (info.status === '—' && info.items.length) {
    const stuck = info.items.some(i => statusClass(i.status) === 's-stuck');
    const inProg = info.items.some(i => statusClass(i.status) === 's-progress');
    const allDone = info.items.every(i => statusClass(i.status) === 's-done');
    if (allDone) info.status = 'Concluído';
    else if (stuck) info.status = 'Parado';
    else if (inProg) info.status = 'Em Progresso';
    else info.status = 'A Aguardar';
  }
  return info;
}

// ═══════════════════════════════════════════════════════════════════════
//  Renderizar relatório
// ═══════════════════════════════════════════════════════════════════════
function renderReport(boardName, d) {
  const root = document.getElementById('root');
  const p = d.progress || 0;
  const sc = statusClass(d.status);
  const items = d.items || [];

  root.innerHTML = `
    <div class="report-header">
      <div class="report-meta">P.A 2026 — Relatório de Projecto</div>
      <div class="report-title">${boardName}</div>
      <div class="report-desc">${d.desc || '<em style="opacity:0.6;">Adicione uma descrição ao board para que apareça aqui.</em>'}</div>
      <div class="report-badges">
        <span class="badge badge-white">👤 ${d.responsavel || 'N/D'}</span>
        <span class="badge badge-white">📅 ${d.inicio||'—'} → ${d.fim||'—'}</span>
        <span class="badge badge-white">🏷 ${d.status||'—'}</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Progresso</div>
        <div class="stat-value">${p}%</div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${p}%;background:${progressColor(p)};"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Orçamento</div>
        <div class="stat-value" style="font-size:17px;">${d.orcamento||'N/D'}</div>
        <div class="stat-sub">Gasto: ${d.gasto||'N/D'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tarefas Concluídas</div>
        <div class="stat-value">${items.filter(i=>statusClass(i.status)==='s-done').length} / ${items.length}</div>
        <div class="stat-sub">de ${items.length} tarefa(s) total</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Estado</div>
        <div style="margin-top:8px;"><span class="status-pill ${sc}" style="font-size:12.5px;padding:5px 12px;">${d.status||'—'}</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📸 Imagens do Projecto</div>
      <div id="img-zone">
        ${renderImages()}
      </div>
    </div>

    <div class="section">
      <div class="section-title">📌 Tarefas &amp; Actividades</div>
      ${items.length ? `
        <div class="items-card">
          <table>
            <thead><tr><th>Tarefa</th><th>Responsável</th><th>Prazo</th><th>Estado</th></tr></thead>
            <tbody>
              ${items.map(it=>`
              <tr>
                <td>${it.nome}</td>
                <td style="color:var(--text-muted);">${it.resp||'—'}</td>
                <td style="color:var(--text-muted);white-space:nowrap;">${it.prazo||'—'}</td>
                <td><span class="status-pill ${statusClass(it.status)}">${it.status||'—'}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      ` : `<div class="empty-section">Este board ainda não tem tarefas registadas.</div>`}
    </div>

    ${d.notas ? `
    <div class="section">
      <div class="section-title">📝 Notas &amp; Observações</div>
      <div class="notes-block">${d.notas}</div>
    </div>` : ''}

    <div class="footer-meta">
      Relatório gerado em ${new Date().toLocaleDateString('pt-PT',{day:'2-digit',month:'long',year:'numeric'})} às ${new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})} — Sistema de Gestão P.A 2026
    </div>
  `;
}

function renderImages() {
  if (!projectImages.length) {
    return `
      <label class="image-upload-zone">
        <input type="file" accept="image/*" multiple onchange="handleImages(this)">
        <span style="font-size:28px;">🖼</span>
        <span>Clique para adicionar imagens ou screenshots</span>
        <span style="font-size:10px;opacity:0.6;">PNG, JPG — múltiplas imagens suportadas</span>
      </label>
    `;
  }
  return `
    <div class="image-grid">
      ${projectImages.map((im, idx) => `
        <div class="image-block">
          <img src="${im.dataUrl}" alt="${im.name}">
          <div class="img-caption">
            <span>📎 ${im.name}</span>
            <button class="img-remove" onclick="removeImage(${idx})">remover</button>
          </div>
        </div>
      `).join('')}
    </div>
    <label class="image-upload-zone" style="height:80px;margin-top:0.85rem;">
      <input type="file" accept="image/*" multiple onchange="handleImages(this)">
      <span>＋ Adicionar mais imagens</span>
    </label>
  `;
}

function handleImages(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      projectImages.push({ name: file.name, dataUrl: e.target.result });
      pending--;
      if (pending === 0) document.getElementById('img-zone').innerHTML = renderImages();
    };
    reader.readAsDataURL(file);
  });

  // Persistir imagens no storage do monday (associadas ao board)
  if (monday && currentBoardId) {
    setTimeout(() => {
      monday.storage.instance.setItem(`images_${currentBoardId}`, JSON.stringify(projectImages))
        .catch(err => console.warn('Não foi possível guardar imagens:', err));
    }, 500);
  }
}

function removeImage(idx) {
  projectImages.splice(idx, 1);
  document.getElementById('img-zone').innerHTML = renderImages();
  if (monday && currentBoardId) {
    monday.storage.instance.setItem(`images_${currentBoardId}`, JSON.stringify(projectImages))
      .catch(() => {});
  }
}

async function loadStoredImages(boardId) {
  if (!monday) return;
  try {
    const res = await monday.storage.instance.getItem(`images_${boardId}`);
    if (res?.data?.value) {
      projectImages = JSON.parse(res.data.value);
    }
  } catch (e) { /* silencioso */ }
}

// ═══════════════════════════════════════════════════════════════════════
//  DEMO (quando aberto fora do monday)
// ═══════════════════════════════════════════════════════════════════════
function showDemo() {
  document.getElementById('banner').classList.add('show');
  document.getElementById('board-sub').textContent = 'Modo Demo — Sem ligação ao monday';
  renderReport('PROJ.1: CC-ANGOSAT-2 (DEMO)', {
    desc: "Centro de Controlo ANGOSAT-2 — instalação, configuração e operacionalização.",
    status: "Em Progresso", progress: 60,

// ═══════════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════════
async function init() {
  if (!monday) {
    showDemo();
    return;
  }

  // Ler contexto do monday (board actual, user, etc.)
  monday.listen('context', async (res) => {
    const ctx = res.data;
    if (!ctx) return;
    currentBoardId = ctx.boardId || ctx.boardIds?.[0];
    if (!currentBoardId) {
      document.getElementById('root').innerHTML = `
        <div class="state-card">
          <div class="icon">📋</div>
          <h3>Sem contexto de board</h3>
          <p>Esta vista deve ser usada dentro de um board do monday.com. Adicione-a como Board View num projecto do P.A 2026.</p>
        </div>`;
      return;
    }
    await loadAndRender();
  });

  // Fallback: se em 2 seg não recebermos contexto, assumimos modo demo
  setTimeout(() => {
    if (!currentBoardId) showDemo();
  }, 2500);
}

async function loadAndRender() {
  try {
    document.getElementById('root').innerHTML = `
      <div class="loading-overlay">
        <div class="spinner-lg"></div>
        <div style="color:var(--text-muted);font-size:13px;">A carregar dados do board…</div>
      </div>`;
    const board = await loadBoardData(currentBoardId);
    currentBoardName = board.name;
    document.getElementById('board-sub').textContent = `${board.name} · P.A 2026`;
    await loadStoredImages(currentBoardId);
    const reportData = buildReportFromBoard(board);
    renderReport(board.name, reportData);
    toast(`✓ ${board.items_page?.items?.length || 0} item(ns) carregado(s)`);
  } catch (e) {
    document.getElementById('root').innerHTML = `
      <div class="state-card">
        <div class="icon">⚠️</div>
        <h3>Erro ao carregar</h3>
        <p>${e.message}</p>
      </div>`;
    toast('Erro: ' + e.message, 'err');
  }
}

function reload() {
  if (currentBoardId) loadAndRender();
  else if (!monday) showDemo();
}

// Arranque
init();
</script>
