<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Relatórios — P.A 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.6/dist/main.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --brand: #14304A; --brand-mid: #2C5F8A; --brand-light: #EAF1F8;
  --accent: #C8963E; --accent-light: #FDF3E3;
  --success: #2D7D52; --success-bg: #E8F5EE;
  --warning: #B8650A; --warning-bg: #FEF3E2;
  --danger: #B03030; --danger-bg: #FCEAEA;
  --info: #1a6fa8; --info-bg: #e8f3fc;
  --neutral: #555f6e; --neutral-bg: #eef0f3;
  --border: #DCE3EC; --bg: #F5F7FA; --white: #FFFFFF;
  --text: #1A2535; --text-muted: #6B7A90;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter Tight', system-ui, sans-serif;
  --radius: 10px; --radius-sm: 6px;
}
body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* TOPBAR */
.topbar { background: var(--brand); color: white; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 52px; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo { width: 32px; height: 32px; border-radius: 7px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; font-family: var(--font-display); }
.topbar-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.topbar-sub { font-size: 11px; opacity: 0.55; margin-top: 1px; }
.topbar-actions { display: flex; gap: 6px; }
.btn-icon { background: rgba(255,255,255,0.10); border: none; border-radius: 6px; color: white; height: 34px; padding: 0 12px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; transition: background 0.2s; font-family: var(--font-body); font-weight: 500; }
.btn-icon:hover { background: rgba(255,255,255,0.22); }
.btn-icon.active { background: rgba(200,150,62,0.35); }
.btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }

.container { padding: 1.25rem; max-width: 1200px; margin: 0 auto; }

/* SELECTOR BAR — Programa & Projecto */
.selector-bar { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.selector-group { display: flex; flex-direction: column; gap: 6px; }
.selector-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.selector-label .step { background: var(--brand); color: white; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
.selector-label .step.done { background: var(--success); }
.selector-dropdown { padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 13px; color: var(--text); background: var(--white); cursor: pointer; transition: all 0.15s; width: 100%; }
.selector-dropdown:hover:not(:disabled) { border-color: var(--brand-mid); }
.selector-dropdown:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(20, 48, 74, 0.08); }
.selector-dropdown:disabled { background: var(--bg); color: var(--text-muted); cursor: not-allowed; }
.selector-hint { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

@media (max-width: 720px) {
  .selector-bar { grid-template-columns: 1fr; }
}

/* STATE CARDS */
.state-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 2.5rem 2rem; text-align: center; color: var(--text-muted); max-width: 560px; margin: 2rem auto; }
.state-card .icon { font-size: 40px; margin-bottom: 0.75rem; }
.state-card h3 { font-family: var(--font-display); font-size: 20px; color: var(--text); margin-bottom: 0.5rem; }
.state-card p { font-size: 13px; line-height: 1.6; }

.loading-overlay { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 3rem 2rem; }
.spinner-lg { width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; }
.spinner-sm { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--brand-mid); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* REPORT HEADER */
.report-header { background: linear-gradient(135deg, var(--brand) 0%, #1f4a72 100%); border-radius: var(--radius); padding: 1.75rem 1.85rem 1.4rem; color: white; margin-bottom: 1.25rem; position: relative; overflow: hidden; }
.report-header::before { content: ''; position: absolute; top: -40px; right: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.04); }
.report-header::after { content: ''; position: absolute; bottom: -50px; right: 60px; width: 110px; height: 110px; border-radius: 50%; background: rgba(200,150,62,0.18); }
.report-meta { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; opacity: 0.65; margin-bottom: 0.5rem; font-weight: 500; }
.report-prog-tag { display: inline-block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.8px; background: rgba(200,150,62,0.30); padding: 3px 9px; border-radius: 4px; margin-bottom: 0.6rem; font-weight: 600; }
.report-title { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin-bottom: 0.7rem; line-height: 1.15; }
.report-desc { font-size: 13.5px; opacity: 0.82; line-height: 1.6; max-width: 620px; margin-bottom: 1rem; }
.report-badges { display: flex; gap: 7px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
.badge-white { background: rgba(255,255,255,0.13); color: white; }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 0.85rem; margin-bottom: 1.25rem; }
.stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 500; }
.stat-value { font-size: 24px; font-weight: 600; color: var(--text); font-family: var(--font-display); letter-spacing: -0.01em; }
.stat-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
.progress-wrap { background: var(--border); border-radius: 99px; height: 5px; overflow: hidden; margin-top: 9px; }
.progress-fill { height: 100%; border-radius: 99px; transition: width 0.8s ease; }

/* SECTIONS */
.section { margin-bottom: 1.25rem; }
.section-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--brand); margin-bottom: 0.85rem; display: flex; align-items: center; gap: 8px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* GROUPS */
.group-block { margin-bottom: 1.25rem; }
.group-header { display: flex; align-items: center; gap: 10px; padding: 0.65rem 1rem; border-radius: var(--radius-sm) var(--radius-sm) 0 0; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
.group-color-bar { width: 4px; height: 18px; border-radius: 2px; flex-shrink: 0; }

/* TABLE */
.items-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.items-card.no-top-radius { border-radius: 0 0 var(--radius) var(--radius); }
table { width: 100%; border-collapse: collapse; }
thead th { background: var(--bg); padding: 9px 12px; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--bg); }
tbody td { padding: 9px 12px; font-size: 12px; color: var(--text); vertical-align: middle; }
.td-name { font-weight: 500; max-width: 260px; }
.td-muted { color: var(--text-muted); }

/* PILLS */
.status-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.s-done     { background: var(--success-bg); color: var(--success); }
.s-progress { background: var(--warning-bg); color: var(--warning); }
.s-stuck    { background: var(--danger-bg); color: var(--danger); }
.s-waiting  { background: var(--brand-light); color: var(--brand); }
.s-blank    { background: var(--neutral-bg); color: var(--neutral); }
.s-info     { background: var(--info-bg); color: var(--info); }

/* IMAGES */
.image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap: 0.85rem; }
.image-block { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.image-block img { width: 100%; height: 180px; object-fit: cover; display: block; }
.img-caption { padding: 0.6rem 0.85rem; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: space-between; }
.img-remove { color: var(--danger); cursor: pointer; font-size: 11px; background: none; border: none; padding: 2px 6px; border-radius: 3px; }
.img-remove:hover { background: var(--danger-bg); }
.image-upload-zone { width: 100%; height: 140px; border: 2px dashed var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: var(--bg); transition: all 0.2s; gap: 6px; color: var(--text-muted); font-size: 12.5px; }
.image-upload-zone:hover { border-color: var(--brand-mid); background: var(--brand-light); color: var(--brand); }
.image-upload-zone input { display: none; }

/* COLUMN DEBUG */
.debug-box { background: #1a2535; color: #7dd3fc; border-radius: var(--radius); padding: 1rem; font-size: 11px; font-family: monospace; overflow-x: auto; margin-bottom: 1rem; max-height: 300px; overflow-y: auto; }
.debug-box h4 { color: #fbbf24; margin-bottom: 0.5rem; font-family: var(--font-body); }

.empty-section { background: var(--white); border: 1px dashed var(--border); border-radius: var(--radius); padding: 1.5rem; text-align: center; color: var(--text-muted); font-size: 12.5px; }
.footer-meta { text-align: right; font-size: 10.5px; color: var(--text-muted); margin-top: 1.5rem; padding-top: 0.85rem; border-top: 1px solid var(--border); }

.standalone-banner { background: var(--accent-light); border-bottom: 1px solid var(--accent); padding: 8px 1.25rem; font-size: 12px; color: var(--warning); display: none; align-items: center; gap: 8px; }
.standalone-banner.show { display: flex; }

.toast { position: fixed; bottom: 20px; right: 20px; z-index: 999; background: var(--brand); color: white; border-radius: var(--radius-sm); padding: 11px 17px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px); transition: all 0.3s; pointer-events: none; max-width: 400px; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.err { background: var(--danger); }

@media print {
  .topbar, .standalone-banner, .image-upload-zone, .img-remove, .selector-bar, #debug-section { display: none !important; }
  .container { padding: 0; max-width: none; }
  body { background: white; }
  .report-header { background: var(--brand) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .group-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">P</div>
    <div>
      <div class="topbar-title">Gerador de Relatórios</div>
      <div class="topbar-sub" id="board-sub">A carregar workspace P.A 2026…</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn-icon" id="debug-btn" onclick="toggleDebug()" style="display:none;">🔍 Colunas</button>
    <button class="btn-icon" id="print-btn" onclick="window.print()" disabled>🖨 Imprimir / PDF</button>
    <button class="btn-icon" onclick="reloadWorkspace()">↻ Recarregar</button>
  </div>
</div>

<div class="standalone-banner" id="banner">
  ⚠️ Aberto fora do monday.com — modo demo. Instala como Workspace App / Board View para dados reais.
</div>

<div class="container">

  <!-- DROPDOWNS: Programa → Projecto -->
  <div class="selector-bar" id="selector-bar" style="display:none;">
    <div class="selector-group">
      <label class="selector-label" for="sel-programa">
        <span class="step" id="step-1">1</span>
        Programa
      </label>
      <select id="sel-programa" class="selector-dropdown" onchange="onProgramaChange()">
        <option value="">— Selecciona um Programa —</option>
      </select>
      <div class="selector-hint" id="hint-programa">A carregar Programas do workspace P.A 2026…</div>
    </div>

    <div class="selector-group">
      <label class="selector-label" for="sel-projecto">
        <span class="step" id="step-2">2</span>
        Projecto
      </label>
      <select id="sel-projecto" class="selector-dropdown" onchange="onProjectoChange()" disabled>
        <option value="">— Primeiro selecciona um Programa —</option>
      </select>
      <div class="selector-hint" id="hint-projecto">Os projectos aparecem após escolheres o Programa.</div>
    </div>
  </div>

  <div id="root">
    <div class="loading-overlay">
      <div class="spinner-lg"></div>
      <div style="color:var(--text-muted);font-size:13px;">A inicializar monday SDK…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════
const monday = window.mondaySdk ? window.mondaySdk() : null;

// Estado global
let workspaceId = null;          // ID do workspace P.A 2026
let workspaceName = '';
let programas = [];              // [{ id, name, boards: [...] }] — folders
let selectedProgramaId = null;
let selectedProjectoId = null;
let currentBoardData = null;
let projectImages = [];
let showDebug = false;

// ═══════════════════════════════════════════════════════════════════════
// Helpers UI
// ═══════════════════════════════════════════════════════════════════════
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'err' ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 4000);
}

function statusClass(s) {
  if (!s) return 's-blank';
  const sl = String(s).toLowerCase();
  if (sl.includes('conclu') || sl.includes('done') || sl.includes('feito') || sl.includes('terminado')) return 's-done';
  if (sl.includes('progress') || sl.includes('progresso') || sl.includes('andamento') || sl.includes('curso') || sl.includes('working')) return 's-progress';
  if (sl.includes('parado') || sl.includes('stuck') || sl.includes('bloqueado') || sl.includes('suspenso') || sl.includes('atrasado') || sl.includes('risco')) return 's-stuck';
  if (sl.includes('aguardar') || sl.includes('waiting') || sl.includes('planned') || sl.includes('não iniciado') || sl.includes('nao iniciado')) return 's-waiting';
  return 's-blank';
}

function phaseClass(s) {
  if (!s) return 's-blank';
  const sl = String(s).toLowerCase();
  if (sl.includes('feito') || sl.includes('done') || sl.includes('conclu')) return 's-done';
  if (sl.includes('em pro') || sl.includes('andamento') || sl.includes('curso')) return 's-progress';
  if (sl.includes('parado') || sl.includes('stuck')) return 's-stuck';
  return 's-blank';
}

function progressColor(p) {
  if (p >= 80) return '#2D7D52';
  if (p >= 50) return '#2C5F8A';
  if (p >= 30) return '#C8963E';
  return '#B03030';
}

function getCol(item, ...titles) {
  for (const title of titles) {
    if (!title) continue;
    const tl = title.toLowerCase();
    const found = item.column_values?.find(c =>
      c.column?.title?.toLowerCase() === tl ||
      c.column?.title?.toLowerCase().includes(tl)
    );
    if (found) {
      if (found.text && found.text.trim()) return found.text.trim();
      if (found.value && found.value !== 'null') {
        try {
          const v = JSON.parse(found.value);
          if (v !== null && v !== undefined) return String(v);
        } catch(e) {}
      }
    }
  }
  return '';
}

function getAllCols(item) {
  const obj = {};
  (item.column_values || []).forEach(cv => {
    const title = cv.column?.title || cv.id;
    let val = cv.text || '';
    if (!val && cv.value && cv.value !== 'null') {
      try { val = String(JSON.parse(cv.value)); } catch(e) {}
    }
    obj[title] = val;
  });
  return obj;
}

function toggleDebug() {
  showDebug = !showDebug;
  document.getElementById('debug-btn').classList.toggle('active', showDebug);
  const db = document.getElementById('debug-section');
  if (db) db.style.display = showDebug ? 'block' : 'none';
}

// ═══════════════════════════════════════════════════════════════════════
// 1) CARREGAR WORKSPACE → PROGRAMAS (folders) → PROJECTOS (boards)
// ═══════════════════════════════════════════════════════════════════════

// Detectar o workspace P.A 2026 a partir de qualquer contexto disponível
async function detectWorkspace(ctx) {
  // Hipótese A: contexto traz workspaceId directamente
  if (ctx?.workspaceId) return ctx.workspaceId;

  // Hipótese B: contexto traz boardId → buscar workspace desse board
  if (ctx?.boardId || ctx?.boardIds?.[0]) {
    const bid = ctx.boardId || ctx.boardIds[0];
    try {
      const q = `query { boards(ids:[${bid}]) { workspace { id name } name } }`;
      const r = await monday.api(q);
      const ws = r.data?.boards?.[0]?.workspace;
      if (ws?.id) {
        workspaceName = ws.name || '';
        return ws.id;
      }
    } catch(e) { console.warn('Falha a obter workspace do board', e); }
  }

  // Hipótese C: procurar workspace com nome "P.A 2026" entre todos
  try {
    const q = `query { workspaces { id name } }`;
    const r = await monday.api(q);
    const list = r.data?.workspaces || [];
    const found = list.find(w =>
      /p\.?\s?a\.?\s*2026/i.test(w.name) ||
      /pa\s*2026/i.test(w.name)
    );
    if (found) {
      workspaceName = found.name;
      return found.id;
    }
    // Se só houver 1 workspace, usa esse
    if (list.length === 1) {
      workspaceName = list[0].name;
      return list[0].id;
    }
  } catch(e) { console.warn('Falha listar workspaces', e); }

  return null;
}

// Carregar todas as folders (Programas) + boards (Projectos) do workspace
async function loadProgramas(wsId) {
  // 1) Listar folders do workspace
  const fQuery = `query {
    folders(workspace_ids: [${wsId}]) {
      id name color
    }
  }`;

  let folders = [];
  try {
    const fRes = await monday.api(fQuery);
    folders = fRes.data?.folders || [];
  } catch(e) {
    console.warn('Falha a carregar folders', e);
  }

  // 2) Listar TODOS os boards do workspace (com a sua folder se aplicável)
  //    Paginamos os boards para apanhar todos.
  let allBoards = [];
  let page = 1;
  while (page <= 10) {
    const bQuery = `query {
      boards(workspace_ids: [${wsId}], limit: 100, page: ${page}, state: active) {
        id name description state
      }
    }`;
    try {
      const bRes = await monday.api(bQuery);
      const list = bRes.data?.boards || [];
      if (!list.length) break;
      allBoards = allBoards.concat(list);
      if (list.length < 100) break;
      page++;
    } catch(e) {
      console.warn('Falha a listar boards página', page, e);
      break;
    }
  }

  // 3) Para cada board, obter a folder a que pertence (API monday: top_group? folder?)
  //    A API moderna usa o campo `board_folder_id` ou similar; tentamos via field na query item-side.
  //    Como fallback simples, fazemos 1 query extra com `board_folder_id` por chunks.
  if (allBoards.length) {
    const chunkSize = 25;
    for (let i = 0; i < allBoards.length; i += chunkSize) {
      const chunk = allBoards.slice(i, i + chunkSize);
      const ids = chunk.map(b => b.id).join(',');
      try {
        const q2 = `query { boards(ids: [${ids}]) { id board_folder_id } }`;
        const r2 = await monday.api(q2);
        const arr = r2.data?.boards || [];
        arr.forEach(b => {
          const t = allBoards.find(x => String(x.id) === String(b.id));
          if (t) t.folderId = b.board_folder_id;
        });
      } catch(e) {
        // Se o campo não existir nesta versão da API, ignorar
        console.warn('Campo board_folder_id indisponível, ignorando agrupamento por folder', e);
        break;
      }
    }
  }

  // 4) Montar estrutura: Programas = folders + boards dessa folder
  const progMap = {};
  folders.forEach(f => {
    progMap[f.id] = { id: f.id, name: f.name, color: f.color, boards: [] };
  });

  // Programa "sem folder" para boards soltos (se houver)
  const looseProg = { id: '__loose__', name: 'Outros Projectos', color: '#888', boards: [] };

  allBoards.forEach(b => {
    const fid = b.folderId;
    if (fid && progMap[fid]) {
      progMap[fid].boards.push(b);
    } else {
      looseProg.boards.push(b);
    }
  });

  const arr = Object.values(progMap);
  if (looseProg.boards.length) arr.push(looseProg);

  // Ordenar por nome (alfabético / natural — para "PROGRAMA 1, 2, 3, 4" ficar bem)
  arr.sort((a, b) => a.name.localeCompare(b.name, 'pt', { numeric: true }));

  return arr;
}

function populateProgramaDropdown() {
  const sel = document.getElementById('sel-programa');
  sel.innerHTML = '<option value="">— Selecciona um Programa —</option>';
  programas.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.name}  (${p.boards.length} projecto${p.boards.length === 1 ? '' : 's'})`;
    if (!p.boards.length) opt.disabled = true;
    sel.appendChild(opt);
  });

  if (programas.length === 0) {
    hint.textContent = '⚠️ Nenhum Programa encontrado no workspace.';
    hint.style.color = 'var(--danger)';
  } else {
    hint.textContent = `${programas.length} Programa(s) disponível(is) no workspace ${workspaceName || 'P.A 2026'}.`;
    hint.style.color = '';
  }
}

function onProgramaChange() {
  const sel = document.getElementById('sel-programa');
  selectedProgramaId = sel.value || null;
  selectedProjectoId = null;

  const selProj = document.getElementById('sel-projecto');
  const hintProj = document.getElementById('hint-projecto');
  const step1 = document.getElementById('step-1');

  if (!selectedProgramaId) {
    selProj.innerHTML = '<option value="">— Primeiro selecciona um Programa —</option>';
    selProj.disabled = true;
    hintProj.textContent = 'Os projectos aparecem após escolheres o Programa.';
    step1.classList.remove('done');
    showInitialState();
    return;
  }

  step1.classList.add('done');
  const prog = programas.find(p => String(p.id) === String(selectedProgramaId));
  if (!prog) return;

  selProj.innerHTML = '<option value="">— Selecciona um Projecto —</option>';
  prog.boards.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.id;
    opt.textContent = b.name;
    selProj.appendChild(opt);
  });
  selProj.disabled = false;
  hintProj.textContent = `${prog.boards.length} projecto(s) no Programa "${prog.name}". Escolhe um para gerar o relatório.`;

  showSelectProjectoState(prog);
}

async function onProjectoChange() {
  const sel = document.getElementById('sel-projecto');
  selectedProjectoId = sel.value || null;
  const step2 = document.getElementById('step-2');

  if (!selectedProjectoId) {
    step2.classList.remove('done');
    const prog = programas.find(p => String(p.id) === String(selectedProgramaId));
    if (prog) showSelectProjectoState(prog);
    document.getElementById('print-btn').disabled = true;
    return;
  }

  step2.classList.add('done');
  await loadAndRenderProjecto(selectedProjectoId);
}

// ═══════════════════════════════════════════════════════════════════════
// 4) CARREGAR PROJECTO (board) — query GraphQL completa
// ═══════════════════════════════════════════════════════════════════════
async function loadBoardData(boardId) {
  // Passo 1: metadados + colunas
  const colQuery = `query {
    boards(ids: [${boardId}]) {
      id name description
      columns { id title type }
    }
  }`;
  const colRes = await monday.api(colQuery);
  const boardMeta = colRes.data?.boards?.[0];
  if (!boardMeta) throw new Error('Projecto não encontrado ou sem permissões.');

  // Passo 2: items com paginação por cursor
  let allItems = [];
  let cursor = null;
  let hasMore = true;
  let page = 0;
  let groups = [];

  while (hasMore && page < 10) {
    page++;
    const limitClause = cursor ? `limit: 200, cursor: "${cursor}"` : `limit: 200`;
    const itemQuery = `query {
      boards(ids: [${boardId}]) {
        groups { id title color position }
        items_page(${limitClause}) {
          cursor
          items {
            id name
            group { id title color }
            column_values {
              id text value
              column { id title type }
            }
          }
        }
      }
    }`;
    const itemRes = await monday.api(itemQuery);
    const board = itemRes.data?.boards?.[0];
    if (!board) break;
    const pageData = board.items_page || {};
    const items = pageData.items || [];
    allItems = allItems.concat(items);
    if (page === 1) groups = board.groups || [];

    if (pageData.cursor && items.length === 200) cursor = pageData.cursor;
    else hasMore = false;
  }

  boardMeta.groups = groups;
  boardMeta.allItems = allItems;
  return boardMeta;
}

// ═══════════════════════════════════════════════════════════════════════
// 5) RELATÓRIO — construir + renderizar
// ═══════════════════════════════════════════════════════════════════════
function buildReport(boardData) {
  const items = boardData.allItems || [];
  const groups = boardData.groups || [];
  const columns = boardData.columns || [];

  const groupMap = {};
  groups.forEach(g => { groupMap[g.id] = { ...g, items: [] }; });
  items.forEach(item => {
    const gid = item.group?.id;
    if (gid && groupMap[gid]) groupMap[gid].items.push(item);
    else {
      if (!groupMap['__other__']) groupMap['__other__'] = { id:'__other__', title:'Geral', color:'#c4c4c4', items:[] };
      groupMap['__other__'].items.push(item);
    }
  });
  const orderedGroups = Object.values(groupMap).sort((a, b) => (a.position ?? 0) - (b.position ?? 0));

  const detectCol = (...keywords) => {
    for (const kw of keywords) {
      const found = columns.find(c => c.title.toLowerCase().includes(kw.toLowerCase()));
      if (found) return found.title;
    }
    return null;
  };
  const colMeta = {
    responsavel:  detectCol('responsável','responsavel','pessoa','owner','assignee','atribuído','pm'),
    status:       detectCol('status','estado'),
    progress:     detectCol('progress','progresso','percentagem','%'),
    prazo:        detectCol('prazo','deadline','data fim','término','fim','end','date'),
    meta:         detectCol('meta'),
    kpis:         detectCol('kpis','kpi'),
    acoes:        detectCol('acções','acoes','acção','acao','actions'),
    f1: detectCol('f1'), f2: detectCol('f2'), f3: detectCol('f3'), f4: detectCol('f4'),
    percentagens: detectCol('percentagens','percentagem total'),
    preal: detectCol('p.real','preal','progresso real','real'),
    pds: detectCol('pds'),
  };

  const totalItems = items.length;
  const doneItems = items.filter(i => statusClass(getCol(i, colMeta.status, 'status')) === 's-done').length;
  let totalProg = 0, progCount = 0;
  items.forEach(i => {
    const n = parseFloat(getCol(i, colMeta.progress, 'progresso', '%'));
    if (!isNaN(n)) { totalProg += n; progCount++; }
  });
  const avgProgress = progCount > 0 ? Math.round(totalProg / progCount) : Math.round((doneItems / (totalItems || 1)) * 100);

  return { name: boardData.name, desc: boardData.description || '', colMeta, columns, orderedGroups, totalItems, doneItems, avgProgress };
}

function renderReport(data, programaName) {
  const root = document.getElementById('root');
  const { name, desc, colMeta, columns, orderedGroups, totalItems, doneItems, avgProgress } = data;
  const p = avgProgress;
  const allDone = doneItems === totalItems && totalItems > 0;
  const anyStuck = orderedGroups.some(g => g.items.some(i => statusClass(getCol(i, colMeta.status, 'status')) === 's-stuck'));
  const globalStatus = allDone ? 'Concluído' : anyStuck ? 'Em Risco' : p > 0 ? 'Em Curso' : 'Não Iniciado';
  const globalSC = statusClass(globalStatus);

  let groupsHTML = '';
  orderedGroups.forEach(g => {
    if (!g.items.length) return;
    const color = g.color || '#c4c4c4';

    const showCols = [];
    if (colMeta.responsavel) showCols.push({ key:'responsavel', label:'Responsável', col:colMeta.responsavel });
    if (colMeta.meta)        showCols.push({ key:'meta', label:'Meta', col:colMeta.meta });
    if (colMeta.kpis)        showCols.push({ key:'kpis', label:'KPIs', col:colMeta.kpis });
    if (colMeta.progress)    showCols.push({ key:'progress', label:'Progresso(%)', col:colMeta.progress });
    if (colMeta.f1) showCols.push({ key:'f1', label:'F1', col:colMeta.f1 });
    if (colMeta.f2) showCols.push({ key:'f2', label:'F2', col:colMeta.f2 });
    if (colMeta.f3) showCols.push({ key:'f3', label:'F3', col:colMeta.f3 });
    if (colMeta.f4) showCols.push({ key:'f4', label:'F4', col:colMeta.f4 });
    if (colMeta.percentagens) showCols.push({ key:'percentagens', label:'Percentagens', col:colMeta.percentagens });
    if (colMeta.preal)        showCols.push({ key:'preal', label:'P.Real', col:colMeta.preal });
    if (colMeta.pds)          showCols.push({ key:'pds', label:'PDS', col:colMeta.pds });
    if (colMeta.prazo)        showCols.push({ key:'prazo', label:'Prazo', col:colMeta.prazo });
    if (colMeta.acoes)        showCols.push({ key:'acoes', label:'Acções', col:colMeta.acoes });
    if (colMeta.status)       showCols.push({ key:'status', label:'Estado', col:colMeta.status });

    let activeCols = showCols;
    if (!activeCols.length) activeCols = columns.slice(0, 8).map(c => ({ key:c.id, label:c.title, col:c.title }));

    const theadCells = activeCols.map(c => `<th>${c.label}</th>`).join('');
    const rows = g.items.map(item => {
      const cells = activeCols.map(c => {
        const val = getCol(item, c.col) || '';
        if (c.key === 'status') {
          const sc = statusClass(val);
          return `<td><span class="status-pill ${sc}">${val || '—'}</span></td>`;
        }
        if (['f1','f2','f3','f4'].includes(c.key)) {
          const pc = phaseClass(val);
          return `<td><span class="status-pill ${pc}" style="font-size:10px;">${val || '—'}</span></td>`;
        }
        if (c.key === 'progress') {
          const num = parseFloat(val) || 0;
          return `<td>
            <div style="display:flex;align-items:center;gap:6px;">
              <div class="progress-wrap" style="width:60px;margin-top:0;">
                <div class="progress-fill" style="width:${Math.min(num,100)}%;background:${progressColor(num)};"></div>
              </div>
              <span style="font-size:11px;font-weight:600;color:${progressColor(num)};">${val || '—'}</span>
            </div>
          </td>`;
        }
        if (c.key === 'preal' || c.key === 'percentagens') {
          const num = parseFloat(val) || 0;
          return `<td style="font-weight:600;color:${progressColor(num)};">${val || '—'}</td>`;
        }
        if (c.key === 'responsavel') return `<td class="td-muted">${val || '—'}</td>`;
        if (c.key === 'acoes') return `<td style="font-size:11px;color:var(--brand-mid);max-width:180px;">${val || '—'}</td>`;
        if (c.key === 'pds') return `<td style="font-size:11px;max-width:200px;word-break:break-word;">${val || '—'}</td>`;
        return `<td class="${!val ? 'td-muted' : ''}">${val || '—'}</td>`;
      }).join('');
      return `<tr><td class="td-name">${item.name}</td>${cells}</tr>`;
    }).join('');

    groupsHTML += `
      <div class="group-block">
        <div class="group-header" style="background:${color}22;color:${color};border:1px solid ${color}44;border-bottom:none;">
          <div class="group-color-bar" style="background:${color};"></div>
          ${g.title}
          <span style="margin-left:auto;font-size:10px;opacity:0.7;">${g.items.length} item(s)</span>
        </div>
        <div class="items-card no-top-radius" style="overflow-x:auto;">
          <table>
            <thead><tr><th>Descrição</th>${theadCells}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  });

  const debugHTML = `
    <div id="debug-section" style="display:${showDebug ? 'block' : 'none'};">
      <div class="section">
        <div class="section-title">🔍 Diagnóstico de Colunas</div>
        <div class="debug-box">
          <h4>Colunas detectadas no projecto (${columns.length} total)</h4>
          <table style="width:100%;border-collapse:collapse;">
            <tr style="color:#fbbf24;"><th style="text-align:left;padding:2px 8px;">Título</th><th style="text-align:left;padding:2px 8px;">Tipo</th><th style="text-align:left;padding:2px 8px;">Mapeado como</th></tr>
            ${columns.map(c => {
              const mapped = Object.entries(colMeta).find(([k,v]) => v === c.title);
              return `<tr style="border-top:1px solid #2a3a4a;">
                <td style="padding:2px 8px;">${c.title}</td>
                <td style="padding:2px 8px;opacity:0.6;">${c.type}</td>
                <td style="padding:2px 8px;color:${mapped ? '#86efac' : '#6b7280'};">${mapped ? mapped[0] : '—'}</td>
              </tr>`;
            }).join('')}
          </table>
        </div>
      </div>
    </div>`;

  root.innerHTML = `
    <div class="report-header">
      <div class="report-meta">P.A 2026 — Relatório de Projecto</div>
      ${programaName ? `<span class="report-prog-tag">📁 ${programaName}</span>` : ''}
      <div class="report-title">${name}</div>
      <div class="report-desc">${desc || '<em style="opacity:0.6;">Sem descrição definida no projecto.</em>'}</div>
      <div class="report-badges">
        <span class="badge badge-white">🏷 ${globalStatus}</span>
        <span class="badge badge-white">📋 ${totalItems} item(s)</span>
        <span class="badge badge-white">✅ ${doneItems} concluído(s)</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Progresso Médio</div>
        <div class="stat-value">${p}%</div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${p}%;background:${progressColor(p)};"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Tarefas Concluídas</div>
        <div class="stat-value">${doneItems} / ${totalItems}</div>
        <div class="stat-sub">de ${totalItems} tarefa(s)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Grupos</div>
        <div class="stat-value">${orderedGroups.filter(g => g.items.length > 0).length}</div>
        <div class="stat-sub">grupos activos</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Estado</div>
        <div style="margin-top:8px;"><span class="status-pill ${globalSC}" style="font-size:12.5px;padding:5px 12px;">${globalStatus}</span></div>
      </div>
    </div>

    ${debugHTML}

    <div class="section">
      <div class="section-title">📸 Imagens do Projecto</div>
      <div id="img-zone">${renderImages()}</div>
    </div>

    <div class="section">
      <div class="section-title">📌 Tarefas &amp; Indicadores</div>
      ${groupsHTML || '<div class="empty-section">Sem tarefas registadas neste projecto.</div>'}
    </div>

    <div class="footer-meta">
      Relatório gerado em ${new Date().toLocaleDateString('pt-PT', { day:'2-digit', month:'long', year:'numeric' })} às ${new Date().toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' })} — Sistema P.A 2026
    </div>
  `;
}

async function loadAndRenderProjecto(boardId) {
  try {
    document.getElementById('root').innerHTML = `
      <div class="loading-overlay">
        <div class="spinner-lg"></div>
        <div style="color:var(--text-muted);font-size:13px;">A carregar dados do projecto…</div>
      </div>`;
    document.getElementById('print-btn').disabled = true;

    const boardData = await loadBoardData(boardId);
    currentBoardData = boardData;
    await loadStoredImages(boardId);

    const prog = programas.find(p => String(p.id) === String(selectedProgramaId));
    const report = buildReport(boardData);
    renderReport(report, prog?.name);

    document.getElementById('debug-btn').style.display = 'flex';
    document.getElementById('print-btn').disabled = false;
    toast(`✓ ${boardData.allItems?.length || 0} item(s) carregado(s)`);
  } catch (e) {
    console.error(e);
    document.getElementById('root').innerHTML = `
      <div class="state-card">
        <div class="icon">⚠️</div>
        <h3>Erro ao carregar projecto</h3>
        <p>${e.message}</p>
      </div>`;
    toast('Erro: ' + e.message, 'err');
  }
}

async function initWorkspace(ctx) {
  document.getElementById('root').innerHTML = `
    <div class="loading-overlay">
      <div class="spinner-lg"></div>
      <div style="color:var(--text-muted);font-size:13px;">A descobrir Programas no workspace P.A 2026…</div>
    </div>`;

  workspaceId = await detectWorkspace(ctx);
  if (!workspaceId) {
    document.getElementById('root').innerHTML = `
      <div class="state-card">
        <div class="icon">📁</div>
        <h3>Workspace P.A 2026 não encontrado</h3>
        <p>A app não conseguiu identificar automaticamente o workspace. Instala-a como <strong>Workspace App</strong> dentro do workspace P.A 2026, ou como <strong>Board View</strong> num dos seus boards.</p>
      </div>`;
    return;
  }

  document.getElementById('board-sub').textContent = `Workspace: ${workspaceName || 'P.A 2026'}`;

  try {
    programas = await loadProgramas(workspaceId);
  } catch(e) {
    console.error(e);
    document.getElementById('root').innerHTML = `
      <div class="state-card">
        <div class="icon">⚠️</div>
        <h3>Erro a carregar Programas</h3>
        <p>${e.message}</p>
      </div>`;
    return;
  }

  document.getElementById('selector-bar').style.display = 'grid';
  populateProgramaDropdown();
  showInitialState();
  toast(`✓ ${programas.length} Programa(s) carregado(s)`);
}

async function reloadWorkspace() {
  // Limpar selecção e recarregar
  selectedProgramaId = null;
  selectedProjectoId = null;
  document.getElementById('step-1').classList.remove('done');
  document.getElementById('step-2').classList.remove('done');
  await initWorkspace({ workspaceId });
}

function renderImages() {
  if (!projectImages.length) {
    return `<label class="image-upload-zone">
      <input type="file" accept="image/*" multiple onchange="handleImages(this)">
      <span style="font-size:28px;">🖼</span>
      <span>Clique para adicionar imagens</span>
      <span style="font-size:10px;opacity:0.6;">PNG, JPG — múltiplas imagens suportadas</span>
    </label>`;
  }
  return `
    <div class="image-grid">
      ${projectImages.map((im, idx) => `
        <div class="image-block">
          <img src="${im.dataUrl}" alt="${im.name}">
          <div class="img-caption">
            <span>📎 ${im.name}</span>
            <button class="img-remove" onclick="removeImage(${idx})">remover</button>
          </div>
        </div>
      `).join('')}
    </div>
    <label class="image-upload-zone" style="height:80px;margin-top:0.85rem;">
      <input type="file" accept="image/*" multiple onchange="handleImages(this)">
      <span>＋ Adicionar mais imagens</span>
    </label>`;
}

function handleImages(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      projectImages.push({ name: file.name, dataUrl: e.target.result });
      pending--;
      if (pending === 0) {
        const z = document.getElementById('img-zone');
        if (z) z.innerHTML = renderImages();
        saveImages();
      }
    };
    reader.readAsDataURL(file);
  });
}

function removeImage(idx) {
  projectImages.splice(idx, 1);
  const z = document.getElementById('img-zone');
  if (z) z.innerHTML = renderImages();
  saveImages();
}

function saveImages() {
  if (monday && selectedProjectoId) {
    monday.storage.instance.setItem(`images_${selectedProjectoId}`, JSON.stringify(projectImages)).catch(() => {});
  }
}

async function loadStoredImages(boardId) {
  projectImages = [];
  if (!monday) return;
  try {
    const res = await monday.storage.instance.getItem(`images_${boardId}`);
    if (res?.data?.value) projectImages = JSON.parse(res.data.value);
  } catch (e) {}
}

  if (!monday) { showDemo(); return; }

  let initialised = false;
  monday.listen('context', async (res) => {
    if (initialised) return;
    initialised = true;
    await initWorkspace(res.data || {});
  });

  // Fallback se o contexto não chegar em 3s
  setTimeout(async () => {
    if (initialised) return;
    initialised = true;
    await initWorkspace({});
  }, 3000);
}

init();
</script>
</body>
</html>
